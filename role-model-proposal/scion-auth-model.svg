<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 790" width="1180" height="790" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1180" height="790" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="30" y="46" font-size="27" font-weight="700" fill="#1e3a8a">Scion Authorization Model</text>
  <text x="30" y="70" font-size="14" fill="#64748b">Roles are held by users and groups. Agents are workloads, not principals.</text>

  <!-- ADMISSION -->
  <rect x="30" y="100" width="250" height="96" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="155" y="128" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">ADMISSION</text>
  <text x="155" y="150" font-size="12.5" fill="#78350f" text-anchor="middle">invite-only  (default)</text>
  <text x="155" y="169" font-size="12.5" fill="#78350f" text-anchor="middle">domain-restricted  ·  open</text>
  <text x="155" y="188" font-size="11.5" font-style="italic" fill="#a16207" text-anchor="middle">grants hub-member only</text>

  <line x1="280" y1="148" x2="392" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HUB -->
  <rect x="400" y="100" width="330" height="96" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5"/>
  <text x="565" y="132" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">HUB</text>
  <text x="565" y="158" font-size="13.5" fill="#1e40af" text-anchor="middle">roles:  superadmin  |  hub-member</text>
  <text x="565" y="180" font-size="11.5" font-style="italic" fill="#3b82f6" text-anchor="middle">hub-member can create projects</text>

  <!-- PRINCIPALS -->
  <rect x="850" y="86" width="300" height="150" rx="10" fill="#f8fafc" stroke="#1e40af" stroke-width="2"/>
  <text x="1000" y="114" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">PRINCIPALS</text>
  <text x="1000" y="134" font-size="11.5" font-style="italic" fill="#64748b" text-anchor="middle">the only things assigned roles</text>
  <rect x="878" y="146" width="244" height="34" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1000" y="169" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">USER</text>
  <rect x="878" y="188" width="244" height="34" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1000" y="211" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">GROUP</text>

  <!-- binding: principals -> project -->
  <path d="M 1000 236 C 1000 256 960 268 908 268" fill="none" stroke="#1d4ed8" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#arrowblue)"/>
  <text x="972" y="296" font-size="12.5" font-weight="700" font-style="italic" fill="#1d4ed8">binding</text>
  <text x="972" y="314" font-size="11.5" font-style="italic" fill="#64748b">role @ scope</text>
  <text x="972" y="331" font-size="11.5" font-style="italic" fill="#64748b">optional expiry</text>

  <!-- hub -> projects -->
  <line x1="500" y1="196" x2="185" y2="262" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="565" y1="196" x2="475" y2="262" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="630" y1="196" x2="700" y2="262" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- PROJECTS -->
  <g>
    <rect x="30" y="270" width="290" height="104" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="175" y="300" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">PROJECT A</text>
    <text x="175" y="325" font-size="12.5" fill="#334155" text-anchor="middle">roles:  owner · member · viewer</text>
    <text x="175" y="347" font-size="12.5" fill="#334155" text-anchor="middle">visibility:  private / team / public</text>
    <text x="175" y="366" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle">always ≥ 1 active owner</text>
  </g>
  <g>
    <rect x="340" y="270" width="290" height="104" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="485" y="300" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">PROJECT B</text>
    <text x="485" y="325" font-size="12.5" fill="#334155" text-anchor="middle">roles:  owner · member · viewer</text>
    <text x="485" y="347" font-size="12.5" fill="#334155" text-anchor="middle">visibility:  private / team / public</text>
  </g>
  <g>
    <rect x="650" y="270" width="290" height="104" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="795" y="300" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">PROJECT N</text>
    <text x="795" y="325" font-size="12.5" fill="#334155" text-anchor="middle">roles:  owner · member · viewer</text>
    <text x="795" y="347" font-size="12.5" fill="#334155" text-anchor="middle">visibility:  private / team / public</text>
  </g>

  <!-- project A -> agents -->
  <line x1="120" y1="374" x2="95" y2="424" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="215" y1="374" x2="245" y2="424" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- AGENTS -->
  <rect x="30" y="432" width="130" height="66" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="95" y="462" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">AGENT</text>
  <text x="95" y="482" font-size="10.5" font-style="italic" fill="#166534" text-anchor="middle">own project only</text>

  <rect x="180" y="432" width="130" height="66" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="245" y="462" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">AGENT</text>
  <text x="245" y="482" font-size="10.5" font-style="italic" fill="#166534" text-anchor="middle">own project only</text>

  <line x1="170" y1="498" x2="170" y2="540" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- WORKSPACE -->
  <rect x="30" y="548" width="280" height="76" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="170" y="576" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle">WORKSPACE / PROFILE</text>
  <text x="170" y="598" font-size="12" fill="#475569" text-anchor="middle">secrets · schedules · logs</text>
  <text x="170" y="616" font-size="10.5" font-style="italic" fill="#64748b" text-anchor="middle">logs redacted of secret values</text>

  <!-- SECRET MANIFEST -->
  <rect x="30" y="646" width="280" height="88" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="170" y="672" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">SECRET MANIFEST</text>
  <text x="170" y="693" font-size="11.5" fill="#991b1b" text-anchor="middle">agent declares secrets by name</text>
  <text x="170" y="711" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">project owner must approve</text>
  <text x="170" y="727" font-size="10.5" font-style="italic" fill="#b91c1c" text-anchor="middle">no enumeration of the store</text>

  <path d="M 160 468 C 328 468 330 640 314 686" fill="none" stroke="#b91c1c" stroke-width="1.8"
        stroke-dasharray="5 4" marker-end="url(#arrowred)"/>

  <text x="30" y="762" font-size="11.5" font-style="italic" fill="#64748b">Agents and workspace live inside a project — they are never assigned roles.</text>

  <!-- ACCESS RESOLUTION -->
  <rect x="350" y="410" width="800" height="324" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="378" y="444" font-size="18" font-weight="700" fill="#b45309">Access resolution</text>

  <g font-size="13.5" fill="#422006">
    <text x="378" y="478">•  Only users and groups receive roles. A role at a scope is a <tspan font-style="italic">binding</tspan>.</text>

    <text x="378" y="512">•  <tspan font-weight="700">Highest access wins</tspan> — the union of all direct and inherited bindings.</text>
    <text x="396" y="532" fill="#78350f">Allow-only: there are no deny rules. A <tspan font-weight="700">suspended</tspan> user is refused everything.</text>

    <text x="378" y="566">•  <tspan font-weight="700">Read</tspan> = member of the project <tspan font-weight="700">OR</tspan> the project's visibility allows it.</text>
    <text x="396" y="586" fill="#78350f">Visibility never grants secrets, at any level including public.</text>

    <text x="378" y="620">•  <tspan font-weight="700">Terminal access is not lifecycle control.</tspan> Members start / stop / message any</text>
    <text x="396" y="640" fill="#78350f">agent, but exec / attach only on their own — unless an owner grants it project-wide.</text>

    <text x="378" y="674">•  <tspan font-weight="700">Agents follow the project, not their creator.</tspan> When a member's binding ends,</text>
    <text x="396" y="694" fill="#78350f">their agents transfer to the project. Suspension stops them instead.</text>
  </g>

  <text x="378" y="722" font-size="12" font-style="italic" fill="#a16207">Bindings, manifest approvals, visibility changes and terminal grants are all audit-logged.</text>

</svg>
